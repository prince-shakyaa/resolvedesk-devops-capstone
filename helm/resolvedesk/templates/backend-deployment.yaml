apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "resolvedesk.backendName" . }}
  labels:
    {{- include "resolvedesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "resolvedesk.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "resolvedesk.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/backend-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "resolvedesk.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        # The headless postgres Service has no DNS record until its pod is Ready, so the
        # migration step would crash-loop on a fresh install. Wait for the port instead.
        - name: wait-for-postgres
          image: {{ .Values.backend.waitForPostgresImage | quote }}
          command: ["sh", "-c"]
          args:
            - until nc -z {{ include "resolvedesk.postgresName" . }} 5432; do echo "waiting for postgres"; sleep 2; done
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "resolvedesk.backendName" . }}
            - secretRef:
                name: {{ include "resolvedesk.backendName" . }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            {{- toYaml .Values.backend.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml .Values.backend.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
