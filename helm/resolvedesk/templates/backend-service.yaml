apiVersion: v1
kind: Service
metadata:
  name: {{ include "resolvedesk.backendName" . }}
  labels:
    {{- include "resolvedesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "resolvedesk.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
