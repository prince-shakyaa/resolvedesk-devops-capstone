{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "resolvedesk.fullname" . }}
  labels:
    {{- include "resolvedesk.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API, Swagger UI and OpenAPI schema go straight to the backend.
          {{- range $path := list "/api" "/docs" "/openapi.json" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "resolvedesk.backendName" $ }}
                port:
                  name: http
          {{- end }}
          # Everything else is the React SPA.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "resolvedesk.frontendName" . }}
                port:
                  name: http
{{- end }}
