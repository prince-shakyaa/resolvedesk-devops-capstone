{{- /* The backend reads a single DATABASE_URL; keep it in a Secret because it embeds the password. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "resolvedesk.backendName" . }}
  labels:
    {{- include "resolvedesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ include "resolvedesk.postgresName" . }}:5432/{{ .Values.postgres.database }}"
  {{- else }}
  DATABASE_URL: {{ required "externalDatabaseUrl is required when postgres.enabled=false" .Values.externalDatabaseUrl | quote }}
  {{- end }}
