# Keep dependencies fresh so the Trivy gate stays green, without flooding the repo:
# monthly cadence, few open PRs, and no automatic major-version bumps.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
  - package-ecosystem: terraform
    directory: /terraform
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
