name: CI/CD

# Pipeline stages:
#   1. test            -> pytest (SQLite test DB) + ruff lint
#   2. frontend-build  -> npm ci + vite build (artifact uploaded)
#   3. validate-infra  -> helm lint/template + terraform fmt/validate
#   4. build-scan-push -> docker build both images, Trivy gate, push to GHCR with SHA tags
#   5. deploy          -> helm upgrade --install (only when DEPLOY_ENABLED repo variable is "true")

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/resolvedesk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Run pytest
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  validate-infra:
    name: Validate Helm and Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Helm lint
        run: helm lint helm/resolvedesk -f helm/resolvedesk/values-dev.yaml
      - name: Helm template (render check)
        run: helm template resolvedesk helm/resolvedesk -f helm/resolvedesk/values-prod.yaml > /dev/null
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff
        working-directory: terraform
      - name: Terraform init (no backend) and validate
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: terraform

  build-scan-push:
    name: Build, scan and push images
    needs: [test, frontend-build, validate-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # arm64 emulation for the multi-arch push
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: full commit SHA (traceability), short sha, branch name and
      # 'latest' on main. The Helm deploy below uses the full SHA.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (linux/amd64, loaded locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan (SARIF report for the Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # Security gate: HIGH/CRITICAL vulnerabilities with an available fix stop the pipeline
      # before any image is pushed to the registry.
      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_SKIP_DB_UPDATE: "true"

      # Multi-arch manifest so the same tag runs on EKS (amd64) and on Apple-silicon laptops
      # (arm64, e.g. minikube / Docker Desktop). amd64 layers come straight from the cache above.
      - name: Push multi-arch image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy:
    name: Deploy with Helm
    needs: build-scan-push
    # Runs only on main and only when the repository variable DEPLOY_ENABLED=true
    # and the KUBE_CONFIG_DATA secret (base64 kubeconfig) has been configured.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info
      - name: Create GHCR pull secret
        run: |
          kubectl create namespace resolvedesk --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --namespace resolvedesk \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Helm upgrade --install
        run: |
          helm upgrade --install resolvedesk ./helm/resolvedesk \
            --namespace resolvedesk \
            -f helm/resolvedesk/values-prod.yaml \
            --set image.tag=${{ github.sha }} \
            --set backend.image.repository=${{ env.IMAGE_PREFIX }}-backend \
            --set frontend.image.repository=${{ env.IMAGE_PREFIX }}-frontend \
            --set imagePullSecrets[0].name=ghcr-pull \
            --set ingress.host=${{ vars.INGRESS_HOST || 'resolvedesk.example.com' }} \
            --wait --timeout 5m
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/resolvedesk-backend -n resolvedesk --timeout=180s
          kubectl rollout status deployment/resolvedesk-frontend -n resolvedesk --timeout=180s
          kubectl get pods,svc,ingress,hpa -n resolvedesk
