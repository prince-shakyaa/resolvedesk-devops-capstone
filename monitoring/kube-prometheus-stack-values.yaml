# Values for the kube-prometheus-stack Helm chart (Prometheus Operator + Prometheus + Grafana).
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
#
# The release name matters: the ResolveDesk ServiceMonitor carries the label
# release=kube-prometheus-stack so this Prometheus instance picks it up.

prometheus:
  prometheusSpec:
    # Discover ServiceMonitors in every namespace, not only those shipped with this chart.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}

grafana:
  enabled: true
  adminPassword: admin   # classroom only; change it or use an existingSecret
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}   # Grafana 12+ needs headroom while building its search index

alertmanager:
  enabled: false

# Trim components that are not needed for a small demo cluster.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
